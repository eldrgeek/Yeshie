<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOMA Editor</title>
<style>
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#1f2328}
  #bar{display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid #e2e2e2;position:sticky;top:0;background:#fff;z-index:5}
  #bar .name{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #presence{display:flex;gap:4px;align-items:center}
  .who{font-size:11px;font-weight:600;color:#fff;padding:2px 8px;border-radius:10px;white-space:nowrap}
  #status{font-size:12px;color:#888;white-space:nowrap}
  #revInput{font:inherit;font-size:12px;padding:4px 8px;border:1px solid #d0d7de;border-radius:6px;width:190px}
  #revBtn{font:inherit;font-size:12px;padding:4px 12px;border:none;border-radius:6px;background:#2563eb;color:#fff;font-weight:600;cursor:pointer}
  #revBtn:disabled{opacity:.5}
  #main{display:flex;height:calc(100% - 38px)}
  #edit{flex:1;min-width:0;overflow:auto;border-right:1px solid #ececec}
  #preview{flex:1;min-width:0;overflow:auto;padding:14px 20px;line-height:1.55}
  #preview h1,#preview h2,#preview h3{border-bottom:1px solid #eee;padding-bottom:.2em}
  #preview pre{background:#f6f8fa;padding:10px;border-radius:6px;overflow:auto}
  #preview code{background:#f0f1f2;padding:1px 5px;border-radius:4px}
  #preview table{border-collapse:collapse}#preview td,#preview th{border:1px solid #ddd;padding:4px 8px}
  .cm-editor{height:100%}.cm-scroller{font-family:'SF Mono',Menlo,monospace;font-size:13px}
  @media(max-width:760px){#preview{display:none}}
</style></head>
<body>
<div id="bar"><span class="name" id="name">Loading…</span><span id="presence"></span><input id="revInput" placeholder="Ask SOMA to revise…"><button id="revBtn">Revise</button><span id="status">connecting…</span></div>
<div id="main"><div id="edit"></div><div id="preview"></div></div>
<script src="/editor.bundle.js"></script>
</body></html>
