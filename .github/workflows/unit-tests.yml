name: Unit Tests

on:
  pull_request:
  push:
    branches:
      - fix/adddns-netlify-token-from-env
      - master

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm ci --prefix packages/relay
      # These three suites drive macOS Accessibility and Claude Desktop, so they
      # cannot load on a Linux runner (jest-worker crashes serialising the error).
      # They still run in local `npm test` on the Mac.
      - run: npm test -- --testPathIgnorePatterns='tests/unit/(ax-inject|ax-inspect|claude-desktop-control)\.test\.ts$'
