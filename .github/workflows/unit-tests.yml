name: Unit Tests

on:
  pull_request:
  push:
    branches:
      - fix/adddns-netlify-token-from-env
      - master

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm ci --prefix packages/relay
      - run: npm test
